[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortlist-ai"
version = "0.1.0"
description = "LangGraph agent that ranks resumes against a job requirement, with grounded reasons and recruiter review."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "mohanish0703" }]
# Exact pins, resolved together on Python 3.11. Later milestones add their libraries here.
dependencies = [
    "google-genai==2.33.0",
    "langgraph==1.2.17",
    "langgraph-checkpoint-sqlite==3.1.2",
    "pydantic==2.12.5",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
# API and UI (milestone 8)
app = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "streamlit==1.66.1",
    "uvicorn==0.54.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["shortlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
